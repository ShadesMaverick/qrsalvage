name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      # requirements.txt records the tested toolchain so CI and local checks use the same
      # versions; package compatibility floors remain in pyproject.toml.
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: ruff check .
      - run: ruff format --check .
      # CLAUDE.md calls complete signatures in the core mandatory, and until this line existed
      # that was a rule the repository stated and no gate enforced. The editable install above
      # is what lets mypy follow the package's own imports.
      - run: mypy

  test:
    # The fast suite on every platform and version we claim to support. This project was
    # developed entirely on one Windows machine, so "it works here" carried no information
    # about anywhere else.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: pytest -m "not regression" -q

  regression:
    # The image corpus, and a check that the generator still produces a corpus that solves.
    # Byte-identical output is deliberately not required: PNG encoders differ between OpenCV
    # builds, and a test that fails on that would say nothing about the method.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: pytest -m regression -q
      - name: the corpus can be regenerated and still solves
        run: |
          python scripts/make_fixtures.py
          pytest -m regression -q

  benchmark-contract:
    # The release benchmark is deliberately not run in full on every commit -- the sealed
    # holdout is evidence for a release candidate, not another development set to optimise
    # against. CI does hold the public contract around it: the varied payload panel, exact-text
    # outcome classes, disjoint seed sets, flat JSONL/CSV rows and the explicit holdout gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: pytest tests/test_benchmark.py tests/test_measurements.py -q
      - run: python -m scripts.benchmark --help

  wheel:
    # Installing from a built wheel, not from the checkout. The browser interface is a data
    # file inside the package, and the difference between "works from source" and "ships" is
    # invisible to every other job here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build==1.6.1
      - run: python -m build --wheel
      - name: the page is inside the wheel
        run: python -c "import zipfile,glob; names=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'qrsalvage/web/index.html' in names, names"
      - name: install the wheel somewhere else entirely and run it
        run: |
          cd "$(mktemp -d)"
          python -m venv .venv
          .venv/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          .venv/bin/qrsalvage synth "WHEEL-INSTALL-CHECK" --out .
          .venv/bin/qrsalvage solve synth_0.png

name: Bug report
description: Report reproducible behavior that differs from the documented result.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach real photographs or recovered payloads. Use `qrsalvage synth` to create a synthetic reproduction. Read the [contribution guide](../../CONTRIBUTING.md) before submitting.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Describe what happened, including exact error messages or incorrect results.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the result you expected and why.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction command
      description: Provide the complete command using synthetic or public fixture data.
      render: shell
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste relevant diagnostic output with secrets removed.
      render: text
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, Ubuntu 24.04, macOS 15
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: 3.12.10
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: qrsalvage commit or version
      placeholder: Commit SHA or release version
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm that this issue includes no real photographs and no recovered payloads.
          required: true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qrsalvage"
version = "0.1.0"
description = "Recover QR codes from what's left of them"
readme = "README.md"
license = "Apache-2.0"
keywords = ["qr", "qrcode", "recovery", "reed-solomon", "erasure", "forensics", "opencv"]
requires-python = ">=3.11"
dependencies = ["numpy>=2.1", "opencv-python>=4.10", "pillow>=10.4", "zxing-cpp>=2.2"]

[project.scripts]
qrsalvage = "qrsalvage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The browser interface is a single static file and has to travel inside the wheel. Without
# this it is silently left out and `qrsalvage serve` answers 500 on an installed copy while
# working perfectly from a source checkout.
[tool.setuptools.package-data]
qrsalvage = ["web/*.html", "web/*.png", "web/*.css", "web/*.js", "web/*.svg", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

# Types are checked, not decorative. The core carries full annotations and mypy holds every
# signature to them; the shells (cli, server, export) are checked against the core's types.
[tool.mypy]
files = ["src", "scripts", "tests"]
exclude = ["^build/"]
# 3.12 rather than the 3.11 floor this project installs on, and the reason is a third-party
# stub rather than a preference. mypy parses stubs with the grammar of the *target* version,
# and numpy 2.5 writes PEP 695 `type` statements into numpy/__init__.pyi -- syntax that does
# not exist before 3.12. Against a 3.11 target that is a syntax error in a file nobody here
# wrote, and mypy stops after it ("errors prevented further checking"), so the whole check is
# lost rather than one line of it. Measured, not assumed: CI installs numpy 2.5.2 and fails,
# the 2.4.6 in the local venv passes even with --no-incremental.
#
# What this gives up is that mypy no longer flags a 3.12-only API used in code that has to run
# on 3.11. That gap is covered by the test matrix, which runs the fast suite on 3.11 -- so the
# floor is still guarded, by execution instead of by inference.
python_version = "3.12"
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true

# The core is the contract: every function fully annotated, no silent Any drift.
[[tool.mypy.overrides]]
module = "qrsalvage.core.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "regression: laeuft gegen das Bildkorpus in fixtures/, langsam",
]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qrsalvage"
version = "0.1.0"
description = "Recover QR codes from what's left of them"
readme = "README.md"
license = "Apache-2.0"
keywords = ["qr", "qrcode", "recovery", "reed-solomon", "erasure", "forensics", "opencv"]
requires-python = ">=3.11"
dependencies = ["numpy>=2.1", "opencv-python>=4.10", "pillow>=10.4", "zxing-cpp>=2.2"]

[project.scripts]
qrsalvage = "qrsalvage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The browser interface is a single static file and has to travel inside the wheel. Without
# this it is silently left out and `qrsalvage serve` answers 500 on an installed copy while
# working perfectly from a source checkout.
[tool.setuptools.package-data]
qrsalvage = ["web/*.html", "web/*.png"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
    "regression: laeuft gegen das Bildkorpus in fixtures/, langsam",
]


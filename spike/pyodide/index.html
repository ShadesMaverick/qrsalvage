<!doctype html>
<!-- The Pyodide spike, worker edition: does the core run in a browser, off the main thread,
     without JSPI - and how fast.

     The first spike proved feasibility on the main thread with a JSPI bridge. This one
     removes both caveats at once: the whole runtime lives in a module worker (the page keeps
     breathing - watch the tick counter run while the solve computes), and the oracle is
     called through zxing-wasm's underlying synchronous embind export, so no JSPI and nothing
     Safari lacks by design. See worker.js for how the sync call is armed.

     Deliberately NOT the product: assets come from a CDN (the production plan self-hosts and
     pins), and only the decode direction of the oracle is bridged.

     Run from the repository root, so the wheel and the fixture are reachable:
         python -m pip wheel . --no-deps -w dist
         python -m http.server 8801
     then open  http://127.0.0.1:8801/spike/pyodide/index.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>qrsalvage — pyodide spike (worker)</title>
<style>
  body { font: 15px/1.6 ui-monospace, monospace; background: #1b252e; color: #f2f4f5;
         max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.2rem; color: #f07ea3; }
  #log div { padding: .15rem 0; border-bottom: 1px solid #26333f; }
  .ok { color: #8fd3b0; } .bad { color: #e0644a; } .t { color: #93a3b0; }
  #alive { color: #93a3b0; }
</style>
</head>
<body>
<h1>qrsalvage — pyodide spike · worker edition</h1>
<div id="alive">main thread alive: 0 ticks</div>
<div id="log"></div>

<script>
"use strict";
const log = (text, cls) => {
  const row = document.createElement("div");
  row.textContent = text;
  if (cls) row.className = cls;
  document.getElementById("log").appendChild(row);
};

// The proof that the page stays responsive: this counter only advances if the main thread
// is free. On the first spike it froze solid for the whole solve.
let ticks = 0;
const ticker = setInterval(() => {
  ticks += 1;
  document.getElementById("alive").textContent = `main thread alive: ${ticks} ticks`;
}, 100);

let progressCount = 0;
const started = performance.now();
const worker = new Worker("./worker.js", { type: "module" });
worker.onmessage = ({ data }) => {
  if (data.type === "stage") {
    log(`${data.label}: ${data.seconds} s`, "t");
  } else if (data.type === "progress") {
    progressCount += 1;
  } else if (data.type === "result") {
    clearInterval(ticker);
    const r = data.report;
    log("");
    log(`solved: ${r.solved} — "${r.text}"`, r.solved ? "ok" : "bad");
    log(`version ${r.version}, ${r.wrong_known}/${r.known_total} known cells wrong, ` +
        `${r.attempts} attempt(s), ${progressCount} progress events received live`);
    log(`solve wall clock in the worker: ${r.seconds} s`, "ok");
    log(`main thread ticked ${ticks} times meanwhile — the page never froze`, "ok");
    log(`total, cold: ${((performance.now() - started) / 1000).toFixed(1)} s`);
    document.title = r.solved ? "spike: SOLVED (worker)" : "spike: failed";
  } else if (data.type === "error") {
    clearInterval(ticker);
    log(data.message, "bad");
    document.title = "spike: error";
  }
};
worker.onerror = (event) => {
  clearInterval(ticker);
  log("worker error: " + event.message, "bad");
  document.title = "spike: error";
};
</script>
</body>
</html>
